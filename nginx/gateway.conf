# 한 포트 게이트웨이: 쇼핑몰 /, 관리자 /admin/, 기획개발 /admin/planning/, API는 dashboard-api 하나(/api/)와
# 고객 화면용 예외 하나(/shop-api/). 브라우저는 총괄·safety·재무 에이전트를 직접 부르지 않는다.
# upstream은 변수로 지정해 요청 때마다 Docker DNS로 찾는다 (서비스가 재시작돼 IP가 바뀌어도, 아직 안 떠 있어도 nginx가 죽지 않는다)
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # 리다이렉트에 내부 포트(80)가 아니라 접속한 주소 그대로를 쓴다 (공개 포트가 8080 등일 때)
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /admin/planning/ 을 /admin/ 보다 먼저 둔다
    location = /admin/planning { return 301 /admin/planning/; }
    location /admin/planning/ {
        alias /srv/planning/;
        try_files $uri $uri/ /admin/planning/index.html;
    }

    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /srv/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 브라우저가 부르는 API는 dashboard-api 하나만
    location /api/ {
        set $dashboard_api http://dashboard-api:8020;
        proxy_pass $dashboard_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 예외: 쇼핑몰 화면이 쓰는 shop-api (접두사를 떼고 넘긴다)
    location /shop-api/ {
        set $shop_api http://shop-api:8010;
        rewrite ^/shop-api/(.*)$ /$1 break;
        proxy_pass $shop_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        root /srv/shop;
        try_files $uri $uri/ /index.html;
    }
}
